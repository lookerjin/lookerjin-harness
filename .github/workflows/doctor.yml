name: harness-doctor

on:
  push:
    branches:
      - main
      - refactor/agent-plugin-v2
      - "refactor/**"
      - "fix/**"
      - "notes/**"
  pull_request:

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/developer/lookerjin-harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run harness doctor
        run: python skills/harness-doctor/scripts/doctor.py --root . --json
      - name: Self-tests
        run: |
          python skills/change-review/scripts/preflight_test.py
          python skills/project-bootstrap/scripts/check-placeholders_test.py
