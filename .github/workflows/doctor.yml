name: harness-doctor

on:
  push:
    branches:
      - main
      - refactor/agent-plugin-v2
      - fix/v2-consistency
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run harness doctor
        run: python skills/harness-doctor/scripts/doctor.py --root . --json
