name: marketplace-ci

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feat/**"
      - "fix/**"
      - "notes/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate marketplace
        run: python scripts/validate_marketplace.py

  lookerjin-harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/lookerjin-harness
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run harness doctor
        run: python skills/harness-doctor/scripts/doctor.py --root . --json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install navigation test extractor outside the project
        run: npm install --prefix "$RUNNER_TEMP/navigation-tools" --ignore-scripts --no-audit --no-fund dependency-cruiser@18.7.0
      - name: Self-tests
        env:
          DEPCRUISE: ${{ runner.temp }}/navigation-tools/node_modules/.bin/depcruise
        run: |
          python skills/change-review/scripts/preflight_test.py
          python skills/project-bootstrap/scripts/check-placeholders_test.py
          python skills/harness-eval/scripts/prepare_test.py
          python skills/engineering-run/scripts/check-plan_test.py
          python skills/verification-run/scripts/check-evidence_test.py
          python skills/harness-doctor/scripts/doctor_test.py
          python skills/system-understand/scripts/code-map_test.py
