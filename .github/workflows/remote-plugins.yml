name: remote-plugin-contracts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  push:
    branches:
      - main
      - "refactor/**"
    paths:
      - ".agents/plugins/marketplace.json"
      - "scripts/validate_marketplace.py"
      - ".github/workflows/remote-plugins.yml"
  pull_request:
    paths:
      - ".agents/plugins/marketplace.json"
      - "scripts/validate_marketplace.py"
      - ".github/workflows/remote-plugins.yml"

permissions:
  contents: read

jobs:
  remote-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate remote plugin contracts
        run: python scripts/validate_marketplace.py --remote
