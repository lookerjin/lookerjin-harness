<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">lookerjin Harness</title>
  <desc id="desc">A rounded white app tile with a multicolor L mark.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.14"/>
    </filter>
    <clipPath id="l-clip">
      <rect x="312" y="190" width="136" height="390" rx="68"/>
      <rect x="312" y="444" width="360" height="136" rx="68"/>
    </clipPath>
  </defs>

  <rect x="82" y="82" width="636" height="636" rx="156" fill="#FFFFFF" stroke="#E8EAED" stroke-width="2" filter="url(#shadow)"/>

  <g clip-path="url(#l-clip)">
    <rect x="280" y="150" width="440" height="470" fill="#FFFFFF"/>
    <polygon points="260,140 520,140 520,300 260,460" fill="#4285F4"/>
    <polygon points="260,300 520,230 520,405 260,555" fill="#EA4335"/>
    <polygon points="260,430 560,300 560,610 260,610" fill="#FBBC05"/>
    <polygon points="430,430 740,430 740,610 330,610" fill="#34A853"/>
  </g>
</svg>
