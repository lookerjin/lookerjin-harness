 / 01<\/span>\n      <\/div>\n    <\/section>\n    <div class=\"benefit-strip wrap\"><span><i aria-hidden=\"true\">○<\/i> 为零基础的你准备<\/span><span><i aria-hidden=\"true\">✳<\/i> 工具、材料与一次烧制已包含<\/span><span><i aria-hidden=\"true\">◷<\/i> 约三周后，带作品回家<\/span><\/div>\n    <section id=\"booking\" class=\"booking-section wrap\" aria-labelledby=\"booking-title\">\n      <div class=\"section-heading\"><div><p class=\"eyebrow\">A LITTLE TIME FOR YOURSELF<\/p><h2 id=\"booking-title\">给自己，留一堂课的时间。<\/h2><\/div><span class=\"section-aside\">一个人专注，或两个人一起。<\/span><\/div>\n      <form id=\"booking-form\" novalidate>\n        <div class=\"course-column\" id=\"courses\">\n          <fieldset class=\"course-fieldset\"><legend><span class=\"step\">01<\/span> 选择一堂喜欢的课<\/legend><p class=\"field-hint\">从手捏到拉坯，找到与泥土相处的方式。<\/p>\n            <label class=\"course-card\"><input type=\"radio\" name=\"course\" value=\"hand\" checked><span class=\"course-art hand-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 120 120\"><path d=\"M27 43L31 86Q60 102 89 86L93 43Z\" fill=\"#c28b6f\"/><ellipse cx=\"60\" cy=\"43\" rx=\"33\" ry=\"12\" fill=\"#e4b59a\"/><ellipse cx=\"60\" cy=\"44\" rx=\"25\" ry=\"7\" fill=\"#9c664e\"/><path d=\"M91 53C118 44 115 87 88 78\" fill=\"none\" stroke=\"#c28b6f\" stroke-width=\"9\"/><path d=\"M42 59L43 83M54 61L55 87M67 61L67 87M79 58L78 83\" stroke=\"#d6a188\" stroke-width=\"2\"/><\/svg><\/span><span class=\"course-info\"><span class=\"course-top\"><strong>手捏入门<\/strong><span class=\"availability\">余 4 位<\/span><\/span><span class=\"course-description\">用指尖塑形，感受泥土最初的温柔。<\/span><span class=\"course-meta\">周六 10:00 <span>·<\/span> 90 分钟<\/span><span class=\"course-price\">¥168 <small>/ 人<\/small><\/span><\/span><span class=\"radio-mark\" aria-hidden=\"true\"><\/span><\/label>\n            <label class=\"course-card\"><input type=\"radio\" name=\"course\" value=\"wheel\"><span class=\"course-art wheel-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 120 120\"><ellipse cx=\"61\" cy=\"96\" rx=\"42\" ry=\"8\" fill=\"#c6bda9\"/><path d=\"M39 34C41 51 29 61 33 79Q60 95 88 79C94 59 78 51 81 34Z\" fill=\"#a77454\"/><ellipse cx=\"60\" cy=\"34\" rx=\"21\" ry=\"8\" fill=\"#cb9a76\"/><ellipse cx=\"60\" cy=\"34\" rx=\"15\" ry=\"4\" fill=\"#79513b\"/><path d=\"M35 64Q60 73 86 64M34 70Q60 79 88 70M35 76Q60 85 88 76\" stroke=\"#d6a27c\" fill=\"none\"/><\/svg><\/span><span class=\"course-info\"><span class=\"course-top\"><strong>拉坯体验<\/strong><span class=\"availability\">余 2 位<\/span><\/span><span class=\"course-description\">跟着转盘的节奏，看器物慢慢生长。<\/span><span class=\"course-meta\">周六 14:00 <span>·<\/span> 120 分钟<\/span><span class=\"course-price\">¥238 <small>/ 人<\/small><\/span><\/span><span class=\"radio-mark\" aria-hidden=\"true\"><\/span><\/label>\n            <label class=\"course-card full\"><input type=\"radio\" name=\"course\" value=\"glaze\" disabled><span class=\"course-art glaze-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 120 120\"><ellipse cx=\"60\" cy=\"70\" rx=\"42\" ry=\"28\" fill=\"#97a69b\"/><ellipse cx=\"60\" cy=\"65\" rx=\"42\" ry=\"27\" fill=\"#c1cdc0\"/><ellipse cx=\"60\" cy=\"65\" rx=\"32\" ry=\"19\" fill=\"#a0b2a1\"/><path d=\"M35 64Q59 44 85 63Q74 83 48 79Z\" fill=\"#d4d9ba\"/><path d=\"M43 55Q57 67 78 69\" fill=\"none\" stroke=\"#7c9789\" stroke-width=\"4\"/><\/svg><\/span><span class=\"course-info\"><span class=\"course-top\"><strong>釉色实验<\/strong><span class=\"availability\">本场已满<\/span><\/span><span class=\"course-description\">在色彩里探索，等待窑火带来的惊喜。<\/span><span class=\"course-meta\">周日 10:00 <span>·<\/span> 90 分钟<\/span><span class=\"course-price\">¥198 <small>/ 人<\/small><\/span><\/span><span class=\"full-dash\" aria-hidden=\"true\">—<\/span><\/label>\n          <\/fieldset>\n          <div class=\"included\"><span aria-hidden=\"true\">✳<\/span><p>把好奇心带来，其他交给我们。<small>每堂课均包含工具、材料和一次烧制；作品约三周后到店自取。<\/small><\/p><\/div>\n        <\/div>\n        <div class=\"reservation-card\"><h3><span class=\"step\">02<\/span> 留下你的预约信息<\/h3><div class=\"people-label\"><span id=\"people-label\">参加人数<\/span><span class=\"field-hint\">每次最多 2 人<\/span><\/div><div class=\"people-picker\" role=\"group\" aria-labelledby=\"people-label\"><button type=\"button\" data-people=\"1\" aria-pressed=\"true\">1 人 <span>独享手作时光<\/span><\/button><button type=\"button\" data-people=\"2\" aria-pressed=\"false\">2 人 <span>和朋友一起<\/span><\/button><\/div><input type=\"hidden\" name=\"people\" id=\"people\" value=\"1\">\n          <div class=\"input-group\"><label for=\"name\">你的姓名<\/label><input id=\"name\" name=\"name\" type=\"text\" autocomplete=\"name\" placeholder=\"怎么称呼你？\" maxlength=\"60\" required aria-describedby=\"name-error\"><p id=\"name-error\" class=\"error\" aria-live=\"polite\"><\/p><\/div>\n          <div class=\"input-group\"><label for=\"email\">电子邮箱<\/label><input id=\"email\" name=\"email\" type=\"email\" autocomplete=\"email\" placeholder=\"you@example.com\" required aria-describedby=\"email-hint email-error\"><p class=\"field-hint\" id=\"email-hint\">用于填写预约信息，本页不会发送邮件。<\/p><p id=\"email-error\" class=\"error\" aria-live=\"polite\"><\/p><\/div>\n          <div class=\"order-summary\" aria-live=\"polite\" aria-atomic=\"true\"><div><span id=\"summary-course\">手捏入门<\/span><span id=\"summary-detail\">¥168 × 1 人<\/span><\/div><div class=\"total-row\"><span>合计<\/span><strong id=\"total\">¥168<\/strong><\/div><p>已包含工具、材料和一次烧制<\/p><\/div>\n          <button type=\"submit\" class=\"submit-button\">确认预约 <span aria-hidden=\"true\">↗<\/span><\/button><p class=\"simulation-note\"><span aria-hidden=\"true\">ⓘ<\/span> 这是一次本地模拟预约，不会扣款或锁定真实名额。<\/p>\n        <\/div>\n      <\/form>\n    <\/section>\n    <section class=\"visit-section\" id=\"visit\"><div class=\"wrap visit-content\"><div><p class=\"eyebrow\">SEE YOU AT THE STUDIO<\/p><h2>在这里，把时间交给双手。<\/h2><p>静水陶作，藏在社区日常里的陶艺小天地。<br>等泥土成形，也等你来坐坐。<\/p><\/div><div class=\"visit-details\"><div><span>找到我们<\/span><p>杭州市拱墅区湖墅南路 58 号<\/p><\/div><div><span>工作室开放时间<\/span><p>周三至周日 <b>10:00–19:00<\/b><\/   text('total-price', `¥${course.price * Number(quantity.value)}`);\n}\nradios.forEach(radio => radio.addEventListener('change', () => {\n  document.getElementById('course-error').hidden = true;\n  document.getElementById('form-content').hidden = false;\n  document.getElementById('confirmation').hidden = true;\n  updateSummary();\n}));\nquantity.addEventListener('change', () => { showError(quantity, ''); updateSummary(); });\n[nameInput, emailInput].forEach(input => input.addEventListener('input', () => showError(input, '')));\nform.addEventListener('submit', event => {\n  event.preventDefault();\n  const course = selectedCourse();\n  const count = Number(quantity.value);\n  const courseError = document.getElementById('course-error');\n  courseError.textContent = !course ? '请选择一堂课程。' : course.seats === 0 ? '这堂课已满，请选择其他课程。' : '';\n  courseError.hidden = !courseError.textContent;\n  const countError = ![1, 2].includes(count) ? '请选择 1 人或 2 人。' : course && count > course.seats ? '所选人数超过余位，请调整人数或更换课程。' : '';\n  const nameError = !nameInput.value.trim() ? '请填写姓名，方便称呼你。' : '';\n  emailInput.value = emailInput.value.trim();\n  const emailError = !emailInput.value ? '请填写邮箱，例如 you@example.com。' : emailInput.validity.typeMismatch || !/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(emailInput.value) ? '请填写完整的邮箱地址，例如 you@example.com。' : '';\n  showError(quantity, countError);\n  showError(nameInput, nameError);\n  showError(emailInput, emailError);\n  if (!courseError.hidden) { radios.find(radio => !radio.disabled).focus(); return; }\n  const firstInvalid = [quantity, nameInput, emailInput].find(input => input.getAttribute('aria-invalid') === 'true');\n  if (firstInvalid) { firstInvalid.focus(); return; }\n  text('confirmation-greeting', `${nameInput.value.trim()}，以下是你的模拟预约信息：`);\n  text('confirmed-course', course.name);\n  text('confirmed-time', `${course.time} · ${course.duration} 分钟`);\n  text('confirmed-quantity', `${count} 人`);\n  text('confirmed-total', `¥${course.price * count}`);\n  document.getElementById('form-content').hidden = true;\n  const confirmation = document.getElementById('confirmation');\n  confirmation.hidden = false;\n  confirmation.focus();\n});\ndocument.getElementById('edit-booking').addEventListener('click', () => {\n  document.getElementById('confirmation').hidden = true;\n  document.getElementById('form-content').hidden = false;\n  quantity.focus();\n});\nupdateSummary();\n<\/script>\n<\/head>\n<body>\n<a class=\"skip-link\" href=\"#courses\">跳到课程选择<\/a>\n<header class=\"site-header wrap\">\n  <a class=\"brand\" href=\"#\" aria-label=\"静水陶作首页\"><span class=\"brand-mark\" aria-hidden=\"true\">静<br>水<\/span><span>静水陶作<small>社区陶艺工作室<\/small><\/span><\/a>\n  <nav aria-label=\"主要导航\"><a href=\"#courses\">选一堂课<\/a><a href=\"#visit\">来工作室<\/a><\/nav>\n<\/header>\n<main>\n  <section class=\"hero wrap\" aria-labelledby=\"hero-title\">\n    <div class=\"hero-copy\"><p class=\"intro\">在杭州，慢慢做一件喜欢的器物。<\/p><h1 id=\"hero-title\">留一点时间，<br>给双手。<\/h1><p class=\"hero-description\">从一团泥开始，感受形状在手中发生。<br>第一次做陶，也可以安心来。<\/p><a class=\"hero-link\" href=\"#courses\">预约你的陶艺时光<span aria-hidden=\"true\">↘<\/span><\/a><\/div>\n    <figure class=\"hero-art\">\n      <svg viewBox=\"0 0 600 440\" role=\"img\" aria-labelledby=\"art-title art-desc\">\n        <title id=\"art-title\">青瓷与泥土的静物插画<\/title><desc id=\"art-desc\">浅青色花瓶、绿釉陶碗与素色小杯静静摆在工作台上。<\/desc>\n        <defs>\n          <linearGradient id=\"vase\" x1=\"0\" x2=\"1\"><stop stop-color=\"#91aea0\"/><stop offset=\".45\" stop-color=\"#c6d4bf\"/><stop offset=\".75\" stop-color=\"#b4c9b3\"/><stop offset=\"1\" stop-color=\"#7d9f8d\"/><\/linearGradient>\n          <linearGradient id=\"bowl\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop stop-color=\"#71958a\"/><stop offset=\".6\" stop-color=\"#8da99a\"/><stop offset=\"1\" stop-color=\"#456f61\"/><\/linearGradient>\n          <linearGradient id=\"cup\"><stop stop-color=\"#c4beaa\"/><stop offset=\".45\" stop-color=\"#e1ddca\"/><stop offset=\"1\" stop-color=\"#b3ad99\"/><\/linearGradient>\n          <radialGradient id=\"light\"><stop stop-color=\"#f3f6ed\"/><stop offset=\"1\" stop-color=\"#dce6dd\"/><\/radialGradient>\n          <filter id=\"grain\"><feTurbulence type=\"fractalNoise\" baseFrequency=\".7\" numOctaves=\"3\" stitchTiles=\"stitch\"/><feColorMatrix type=\"saturate\" values=\"0\"/><feComponentTransfer><feFuncA type=\"linear\" slope=\".065\"/><\/feComponentTransfer><feBlend in=\"SourceGraphic\" mode=\"multiply\"/><\/filter>\n        <\/defs>\n        <path d=\"M81 336C37 257 70 128 185 76C285 30 425 51 493 150C556 241 535 322 478 369Z\" fill=\"url(#light)\"/>\n        <path d=\"M52 355C191 327 387 330 558 365\" fill=\"none\" stroke=\"#b7c6b9\" stroke-width=\"1\"/>\n        <ellipse cx=\"302\" cy=\"353\" rx=\"207\" ry=\"20\" fill=\"#708975\" opacity=\".12\"/>\n        <g filter=\"url(#grain)\">\n          <path d=\"M302 126C302 164 298 178 278 204C251 240 249 276 261 313C272 341 359 345 379 316C398 286 382 237 361 204C342 177 342 158 344 126Z\" fill=\"url(#vase)\"/>\n          <ellipse cx=\"323\" cy=\"127\" rx=\"22\" ry=\"7\" fill=\"#91ab95\"/><ellipse cx=\"323\" cy=\"126\" rx=\"16\" ry=\"3.8\" fill=\"#536e5b\"/>\n          <path d=\"M280 222C267 249 265 275 269 289\" fill=\"none\" stroke=\"#e4eadb\" stroke-width=\"4\" opacity=\".35\"/>\n          <path d=\"M114 295C126 336 142 355 191 359C238 360 264 338 275 295Z\" fill=\"url(#bowl)\"/>\n          <ellipse cx=\"194.5\" cy=\"295\" rx=\"80.5\" ry=\"22\" fill=\"#b1c8b9\"/><ellipse cx=\"194.5\" cy=\"296\" rx=\"71\" ry=\"16\" fill=\"#547b6d\"/><path d=\"M128 296C159 277 231 280 258 297\" fill=\"none\" stroke=\"#7e9f8f\" stroke-width=\"3\"/>\n          <path d=\"M371 298L378 352C380 368 440 370 445 352L452 298Z\" fill=\"url(#cup)\"/><ellipse cx=\"411.5\" cy=\"298\" rx=\"40.5\" ry=\"13\" fill=\"#e4dfcc\"/><ellipse cx=\"411.5\" cy=\"298\" rx=\"32\" ry=\"8\" fill=\"#9d9c85\"/><path d=\"M451 310C482 303 481 343 447 341\" fill=\"none\" stroke=\"#b9b39e\" stroke-width=\"10\"/>\n        <\/g>\n        <path d=\"M323 122C314 91 332 65 349 43M326 89C350 92 366 76 366 67C349 67 334 74 326 89M324 106C305 101 298 86 301 77C315 82 322 92 324 106\" fill=\"none\" stroke=\"#6b8270\" stroke-width=\"2.2\" stroke-linecap=\"round\"/>\n        <path d=\"M469 365L510 345\" stroke=\"#a69f84\" stroke-width=\"6\" stroke-linecap=\"round\"/><path d=\"M487 371L530 351\" stroke=\"#c1b79b\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n      <\/svg>\n      <figcaption>泥土有自己的节奏，做陶也是。<\/figcaption>\n    <\/figure>\n  <\/section>\n  <div class=\"details-strip wrap\"><p><span aria-hidden=\"true\">✳︎<\/span> 为初次体验的成年人准备<\/p><p>工具、材料与一次烧制已包含<\/p><p>作品约三周后到店自取<\/p><\/div>\n  <section id=\"courses\" class=\"booking-section wrap\" aria-labelledby=\"courses-title\">\n    <div class=\"courses-column\">\n      <div class=\"section-heading\"><div><p class=\"section-note\">从这里开始<\/p><h2 id=\"courses-title\">哪一种，想试试？<\/h2><\/div><span class=\"weekend-note\">周末课程<\/span><\/div>\n      <form id=\"booking-form\" novalidate>\n        <fieldset class=\"course-options\"><legend class=\"sr-only\">选择课程<\/legend>\n          <label class=\"course-option selected\"><input type=\"radio\" name=\"course\" value=\"hand\" checked><span class=\"course-art hand-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><path d=\"M17 40Q44 28 73 40L66 64Q46 76 23 63Z\" fill=\"#c4c0aa\"/><ellipse cx=\"45\" cy=\"40\" rx=\"28\" ry=\"10\" fill=\"#e0ddc9\"/><ellipse cx=\"45\" cy=\"40\" rx=\"22\" ry=\"6\" fill=\"#a8a78e\"/><path d=\"M26 52Q45 62 64 52M28 59Q45 67 61 59\" fill=\"none\" stroke=\"#a6a58e\"/><\/svg><\/span><span class=\"course-copy\"><span class=\"course-name\">手捏入门<\/span><span class=\"course-description\">用指尖塑形，认识泥土的柔软。<\/span><span class=\"course-meta\">周六 10:00 <span>90 分钟<\/span><\/span><span class=\"availability\">余 4 位<\/span><\/span><span class=\"course-price\">¥168<small>/ 人<\/small><span class=\"radio-symbol\" aria-hidden=\"true\"><\/span><\/span><\/label>\n          <label class=\"course-option\"><input type=\"radio\" name=\"course\" value=\"wheel\"><span class=\"course-art wheel-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><ellipse cx=\"45\" cy=\"70\" rx=\"31\" ry=\"7\" fill=\"#c2cfc5\"/><path d=\"M31 27C32 40 19 47 24 64Q44 74 66 64C71 47 58 40 59 27Z\" fill=\"#89a99a\"/><ellipse cx=\"45\" cy=\"27\" rx=\"14\" ry=\"5\" fill=\"#b0c6b7\"/><ellipse cx=\"45\" cy=\"27\" rx=\"10\" ry=\"2.5\" fill=\"#557b68\"/><path d=\"M25 55Q46 63 65 55M24 60Q44 68 66 60\" fill=\"none\" stroke=\"#719282\"/><\/svg><\/span><span class=\"course-copy\"><span class=\"course-name\">拉坯体验<\/span><span class=\"course-description\">跟随转盘，找一找双手的平衡。<\/span><span class=\"course-meta\">周六 14:00 <span>120 分钟<\/span><\/span><span class=\"availability\">余 2 位<\/span><\/span><span class=\"course-price\">¥238<small>/ 人<\/small><span class=\"radio-symbol\" aria-hidden=\"true\"><\/span><\/span><\/label>\n          <label class=\"course-option full\"><input type=\"radio\" name=\"course\" value=\"glaze\" disabled><span class=\"course-art glaze-art\" aria-hidden=\"true\"><svg viewBox=\"0 0 90 90\"><path d=\"M22 26L45 21L51 49L29 55Z\" fill=\"#b2bfa3\"/><path d=\"M44 37L68 34L72 64L47 68Z\" fill=\"#87a5a0\"/><path d=\"M19 53L43 49L47 74L23 78Z\" fill=\"#d1c4ad\"/><circle cx=\"31\" cy=\"30\" r=\"2\" fill=\"#f1f3eb\"/><circle cx=\"52\" cy=\"43\" r=\"2\" fill=\"#e8efe8\"/><\/svg><\/span><span class=\"course-copy\"><span class=\"course-name\">釉色实验<\/span><span class=\"course-description\">把颜色交给釉，留一点惊喜给窑火。<\/span><span class=\"course-meta\">周日 10:00 <span>90 分钟<\/span><\/span><span class=\"availability sold-out\">已满 · 暂不可预约<\/span><\/span><span class=\"course-price\">¥198<small>/ 人<\/small><span class=\"radio-symbol\" aria-hidden=\"true\"><\/span><\/span><\/label>\n        <\/fieldset>\n        <p id=\"course-error\" class=\"field-error\" hidden><\/p>\n      <\/form>\n      <aside class=\"good-to-know\"><h3>来之前，知道这些就好<\/h3><p>不需要陶艺基础，也不用自带工具。费用包含工具、材料和一次烧制；完成的作品约三周后到工作室自取。<\/p> 计划，记下了。<\/h2><p id=\"confirmation-greeting\"><\/p><dl><div><dt>课程<\/dt><dd id=\"confirmed-course\"><\/dd><\/div><div><dt>时间<\/dt><dd id=\"confirmed-time\"><\/dd><\/div><div><dt>人数<\/dt><dd id=\"confirmed-quantity\"><\/dd><\/div><div><dt>合计<\/dt><dd id=\"confirmed-total\"><\/dd><\/div><\/dl><p class=\"confirmation-note\">此确认仅在本页面展示，没有实际锁位、扣款或发送邮件。刷新页面后记录会清除。<\/p><button id=\"edit-booking\" type=\"button\" class=\"edit-button\">修改预约信息<\/button><\/section>\n    <\/aside>\n  <\/section>\n  <section id=\"visit\" class=\"visit-section wrap\" aria-labelledby=\"visit-title\"><div><p class=\"section-note\">在街区里，给日常留点空白<\/p><h2 id=\"visit-title\">我们在静水等你。<\/h2><\/div><div class=\"visit-details\"><div><h3>工作室地址<\/h3><p>杭州市拱墅区湖墅南路 58 号<\/p><\/div><div><h3>开门时间<\/h3><p>周三至周日 10:00–19:00<\/p><\/div><\/div><svg class=\"visit-drawing\" viewBox=\"0 0 150 120\" aria-hidden=\"true\"><path d=\"M36 42Q73 32 114 42L104 95Q74 110 46 95Z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><ellipse cx=\"75\" cy=\"42\" rx=\"39\" ry=\"12\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><path d=\"M51 68Q75 77 102 67M57 85Q75 92 96 85M71 30C62 18 78 15 72 5M89 30C83 20 96 17 91 8\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><\/svg><\/section>\n<\/main>\n<footer class=\"site-footer wrap\"><span>静水陶作<\/span><p>一团泥，一段慢下来的时光。<\/p><a href=\"#\">回到顶部 ↑<\/a><\/footer>\n<\/body>\n<\/html>\n"}</script><script>const data=JSON.parse(document.querySelector('#artifacts').textContent);const frame=document.querySelector('iframe');frame.srcdoc=data.baseline;for(const button of document.querySelectorAll('[data-variant]'))button.addEventListener('click',()=>{frame.srcdoc=data[button.dataset.variant];for(const item of document.querySelectorAll('[data-variant]'))item.setAttribute('aria-pressed',String(item===button));document.querySelector('#status').textContent=button.textContent+' · 原始产物';});document.querySelector('#width').addEventListener('change',ev
